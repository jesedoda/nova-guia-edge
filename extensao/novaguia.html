<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="novaguia.js" defer></script>
</head>
<body class="novaguia">
  <!-- Mostrado só quando não há URL, quando está offline ou falta permissão.
       Os textos são traduzidos só nesse caso, para não atrasar o redirecionamento. -->
  <main id="aviso" hidden>
    <h1 id="aviso-titulo"></h1>
    <p id="aviso-texto"></p>
    <ul id="aviso-links"></ul>
    <p class="acoes">
      <button id="tentar" type="button" data-i18n="botaoTentar" hidden></button>
      <button id="abrir-opcoes" type="button" data-i18n="botaoConfigurar"></button>
    </p>
  </main>

  <!-- Modo "moldura": a página aparece dentro da guia e o foco fica na barra de endereço. -->
  <iframe id="moldura" hidden data-i18n-title="novaGuiaMoldura"></iframe>
  <a id="sair-moldura" hidden data-i18n-title="novaGuiaSairMoldura">↗</a>
</body>
</html>
