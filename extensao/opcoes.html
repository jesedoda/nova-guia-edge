<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="opcoesTitulo">Nova Guia com URL</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="opcoes.js" defer></script>
</head>
<!-- Os textos vêm de _locales/*/messages.json (atributos data-i18n*); o corpo fica oculto até
     serem aplicados, para não piscar a chave crua. -->
<body class="opcoes carregando">
  <h1 data-i18n="nome"></h1>

  <form id="form">
    <fieldset>
      <legend data-i18n="legendPaginas"></legend>
      <label for="urls" data-i18n-html="rotuloUrls"></label>
      <textarea id="urls" rows="5" spellcheck="false" placeholder="https://www.bing.com&#10;github.com"></textarea>

      <p class="linha" data-i18n="comMaisDeUma"></p>
      <label><input type="radio" name="escolha" value="primeira"> <span data-i18n="escolhaPrimeira"></span></label>
      <label><input type="radio" name="escolha" value="rotacao"> <span data-i18n="escolhaRotacao"></span></label>
      <label><input type="radio" name="escolha" value="aleatoria"> <span data-i18n="escolhaAleatoria"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="legendAbertura"></legend>
      <label><input type="radio" name="abertura" value="substituir"> <span data-i18n-html="aberturaSubstituir"></span></label>
      <label><input type="radio" name="abertura" value="aba"> <span data-i18n-html="aberturaAba"></span></label>
      <label><input type="radio" name="abertura" value="moldura"> <span data-i18n-html="aberturaMoldura"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="legendOffline"></legend>
      <label for="reserva" data-i18n="rotuloReserva"></label>
      <input type="text" id="reserva" spellcheck="false" data-i18n-placeholder="exemploReserva">
    </fieldset>

    <fieldset>
      <legend data-i18n="legendSync"></legend>
      <label><input type="checkbox" id="usarSync"> <span data-i18n="rotuloSync"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="legendIdioma"></legend>
      <select id="idioma">
        <option value="auto" data-i18n="idiomaAuto"></option>
        <!-- Nomes de idioma ficam sempre na própria língua. -->
        <option value="en">English</option>
        <option value="pt_BR">Português (Brasil)</option>
      </select>
    </fieldset>

    <div id="erros" class="erros" role="alert" hidden></div>
    <div id="aviso-arquivo" class="alerta" data-i18n-html="avisoArquivo" hidden></div>

    <p class="acoes">
      <button type="submit" data-i18n="botaoSalvar"></button>
      <button type="button" id="testar" data-i18n="botaoTestar"></button>
      <span id="status" role="status"></span>
    </p>
  </form>

  <p class="rodape"><span data-i18n="versao"></span> <span id="versao"></span></p>
</body>
</html>
